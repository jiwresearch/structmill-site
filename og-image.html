<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{
      width:1200px;height:630px;
      background:#F5F0E6;
      font-family:"Zilla Slab",Georgia,serif;
      color:#355E3B;
      overflow:hidden;
    }
    .wrap{
      width:100%;height:100%;
      padding:70px 100px;
      display:flex;flex-direction:column;justify-content:space-between;
    }
    .wordmark{
      display:flex;align-items:center;gap:22px;
      font-weight:700;
      font-size:56px;
      letter-spacing:-0.02em;
      line-height:1;
    }
    .wordmark svg{
      width:64px;height:57px;
      flex-shrink:0;
    }
    .board{
      display:block;
      width:100%;
      height:auto;
    }
    .hero{
      font-weight:700;
      font-size:76px;
      line-height:1.02;
      letter-spacing:-0.025em;
      max-width:20ch;
    }
    .foot{
      display:flex;justify-content:space-between;align-items:baseline;
      font-weight:500;font-size:26px;color:#3A3A36;
    }
    .foot .url{font-weight:600;color:#355E3B;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">
      <svg viewBox="0 0 36 32" fill="none" stroke="#355E3B" stroke-width="2.5" stroke-linecap="square">
        <line x1="5"  y1="26" x2="29" y2="26"/>
        <line x1="9"  y1="22" x2="27" y2="22"/>
        <line x1="3"  y1="18" x2="31" y2="18"/>
        <line x1="11" y1="14" x2="25" y2="14"/>
        <line x1="7"  y1="10" x2="29" y2="10"/>
      </svg>
      <span>Structmill</span>
    </div>

    <svg class="board" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="8" height="8" fill="#ECE5D4"/>
          <line x1="0" y1="0" x2="0" y2="8" stroke="#355E3B" stroke-width="1.5" opacity="0.38"/>
        </pattern>
      </defs>
      <rect x="630" y="30" width="370" height="72" fill="url(#h)"/>
      <rect x="0" y="30" width="630" height="72" fill="#355E3B"/>
      <rect x="0" y="30" width="1000" height="72" fill="none" stroke="#234229" stroke-width="2"/>
      <line x1="630" y1="16" x2="630" y2="116" stroke="#234229" stroke-width="2" stroke-dasharray="7 5"/>
      <g font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="2" fill="#3A3A36">
        <text x="315" y="140" text-anchor="middle">BECOMES A WALL</text>
        <text x="815" y="140" text-anchor="middle" fill="#355E3B" opacity="0.75">THROWN AWAY</text>
      </g>
    </svg>

    <div class="hero">Every board leaves something behind.</div>

    <div class="foot">
      <div>Pre-cut framing, from the lumberyard.</div>
      <div class="url">structmill.com</div>
    </div>
  </div>
</body>
</html>
